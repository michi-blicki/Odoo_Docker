services:
  odoo-prod-db:
    image: postgres:16
    container_name: odoo-prod-db
    restart: always
    command: "postgres -c config_file=/etc/postgresql/postgresql.conf"
    environment:
      - POSTGRES_PASSWORD=
      - POSTGRES_USER=odoo
      - PGUSER=odoo
      - POSTGRES_DB=odoo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "odoo", "-d", "odoo"]
      interval: 2s
      timeout: 60s
      retries: 20
      start_period: 1s
    networks:
      - net
    volumes:
      - "postgres_conf:/etc/postgresql:rw"
      - "postgres_data:/var/lib/postgresql/data:rw"
      - "backup:/srv/backup:rw"

  odoo-prod-app:
    image: blicki/odoo:18.0-PROD
    container_name: odoo-prod-app
    restart: always
    depends_on:
      odoo-prod-db:
        condition: service_healthy
        required: true
    environment:
      - ODOO_DB_HOST=odoo-prod-db
      - ODOO_DB_PORT=5432
      - ODOO_DB_USER=odoo
      - ODOO_DB_NAME=odoo
      - ODOO_DB_PASSWORD=
      - ODOO_ADMIN_PASSWORD=
      - ODOO_LOGFILE=/var/log/odoo/odoo.log
      - ODOO_LOGROTATE=False
      - ODOO_WITHOUT_DEMO=all
      - TZ=
    networks:
      - net
      - web
    volumes:
      - "odoo_data:/var/lib/odoo:rw"
      - "odoo_local_share:/srv/odoo/.local/share/Odoo:rw"
      - "odoo_custom_addons:/srv/odoo/odoo-custom-addons:ro"
      - "odoo_logs:/var/log/odoo:rw"
      - "backup:/srv/backup:rw"

  odoo-prod-web:
    image: nginx:stable-alpine
    container_name: odoo-prod-web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - web
    volumes:
      - "nginx_conf:/etc/nginx/conf.d:ro"
      - "nginx_cert:/etc/nginx/cert:ro"
      - "nginx_logs:/var/log/nginx:rw"
      - "certb_html:/var/www/certbot:rw"

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - "nginx_cert:/etc/letsencrypt:rw"
      - "certb_html:/var/www/certbot:rw"
    entrypoint: /bin/sh
    command: -c "sleep infinity"
    networks:
      - web

volumes:
  postgres_conf:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/docker/odoo-prod/postgresql_conf
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/docker/odoo-prod/postgresql_data

  odoo_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/docker/odoo-prod/odoo_data
  odoo_local_share:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/docker/odoo-prod/odoo_local_share
  odoo_custom_addons:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/docker/odoo-prod/odoo_custom_addons
  odoo_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/docker/odoo-prod/odoo_logs

  backup:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/backup/odoo-prod

  nginx_conf:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/docker/odoo-prod/nginx_conf
  nginx_cert:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/docker/odoo-prod/nginx_cert
  nginx_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/docker/odoo-prod/nginx_logs

  certb_html:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/docker/odoo-prod/certbot_html

networks:
  net:
    external: false
  web:
    external: false
